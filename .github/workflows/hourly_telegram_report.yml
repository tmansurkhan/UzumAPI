name: Uzum API main

on:
  schedule:
    - cron: "23 20 * * *"  # Har soatda ishga tushadi
  workflow_dispatch:  # Qo'lda ishga tushirish imkoniyati

jobs:
  run-python-scripts:
    runs-on: ubuntu-latest

    env:
      GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
      UZUM_API_TOKEN: ${{ secrets.UZUM_API_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Repositoryni yuklab olish
        uses: actions/checkout@v4

      - name: Pythonni o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kutubxonalarni o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install gspread google-auth requests pandas matplotlib

      - name: Service account faylini yaratish
        run: echo "${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}" > service_account.json

      - name: Uzum API skriptini ishga tushurish
        run: |
          python main.py
          python hour.py

      - name: Har soatlik hisobotni yuborish (Telegram)
        run: python telegramhour.py
