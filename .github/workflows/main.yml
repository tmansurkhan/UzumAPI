name: Kunlik telegram hisobot

on:
  schedule:
    - cron: '0 6 * * *'  # Har kuni 06:00 (UTC) — O'zbekiston vaqti bilan 11:00
  workflow_dispatch:     # Qo'lda ishga tushirish uchun

jobs:
  send_daily_report:
    runs-on: ubuntu-latest

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}

    steps:
      - name: Kodni yuklab olish
        uses: actions/checkout@v4

      - name: Pythonni o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kutubxonalarni o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install gspread google-auth requests pandas

      - name: Kechagi hisobotni yuborish
        run: python daily_report.py
