name: Run Python Script Manually

on:
  workflow_dispatch:

jobs:
  run-python-script:
    runs-on: windows-latest  # This will run on a Windows environment

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.9'  # Adjust the version if needed

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Python script
      run: python your_script.py  # Replace with the name of your script
