name: Run Python script every hour

on:
  schedule:
    - cron: '0 * * * *'  # This runs every hour
  workflow_dispatch:  # This allows manual triggering of the workflow

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create service account credentials file from secret
        run: |
          echo "$GOOGLE_CREDS_JSON" > service_account.json

      - name: Run the Python script
        run: |
          python main.py
        env:
          SERVIC_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}

      - name: Clean up
        run: |
          rm -f service_account.json
