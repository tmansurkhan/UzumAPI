name: Withdrawn Report

on:
  workflow_dispatch:
    inputs:
      START_DATE:
        description: 'Hisobot boshlanish sanasi (Format: YYYY-MM-DD)'
        required: true
      END_DATE:
        description: 'Hisobot tugash sanasi (Format: YYYY-MM-DD)'
        required: true

jobs:
  run_report:
    runs-on: ubuntu-latest
    steps:
    - name: Kodni yuklab olish
      uses: actions/checkout@v4

    - name: Python o'rnatish
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Kerakli kutubxonalarni o'rnatish
      run: |
        python -m pip install --upgrade pip
        pip install gspread pandas requests google-auth matplotlib

    - name: Hisobotni ishga tushurish
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
        START_DATE: ${{ github.event.inputs.START_DATE }}
        END_DATE: ${{ github.event.inputs.END_DATE }}
      run: |
        python withdrawnbotton.py